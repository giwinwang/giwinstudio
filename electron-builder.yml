appId: studio.giwin.desktop
productName: 极物 GIWIN Studio
asar: true
# 复用 node_modules 里已下载的 Electron 运行时（版本与 devDependency 一致），
# 避免打包时再走 GitHub 下载（实测遇到过 502）。
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - "*.html"
  - "*.js"
  - "*.json"
  - "*.png"
  - "*.ico"
  - "*.svg"
  - "*.wav"
  - "license-required.flag"
  - "assets/**/*"
  - "fonts/**/*"
  - "logos/**/*"
  - "!tests/**/*"
  - "!tools/**/*"
  - "!docs/**/*"
  - "!*.md"
  # 改动前的源码备份（canvas.before-xxx.js 之类），只是本机回滚用：
  # 25 个文件共 28MB，以前被 "*.js" 一起打进 asar，白让安装包胖了 8MB，
  # 而且等于把历史源码随安装包发给客户。
  - "!*before-*.js"
  - "!gw-boot.log"
  - "!runtime-crash.log"
  - "!$null"
  - "!release/**/*"
  - "!node_modules/marzipano/demos/**/*"
  - "!node_modules/marzipano/scripts/**/*"
win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: GIWIN-Studio-${version}-Beta-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerLanguages:
    - zh_CN
  language: "2052"
  multiLanguageInstaller: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 极物 GIWIN Studio
  deleteAppDataOnUninstall: false
