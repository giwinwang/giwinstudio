# ============================================================================
# 极物融合 · API 反向代理
#   客户端  ──▶  https://api.giwin.cn  ──▶  https://api.apilio.ai
#
# 目的：客户端与抓包都只看得到 giwin.cn，看不到上游域名。
# 放置：/etc/nginx/sites-available/api.giwin.cn（再 ln -s 到 sites-enabled 下）
# 校验：nginx -t && systemctl reload nginx
# ============================================================================

# --- 限流：防止有人扫到本域名后刷带宽 ---------------------------------------
# 生图是「一次请求等 60~180 秒」，不是高频短请求，60 次/分钟 + 30 突发足够宽松。
limit_req_zone $binary_remote_addr zone=fusion_api:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=fusion_conn:10m;

# --- 上游 -------------------------------------------------------------------
# 用 upstream 块而不是直接写在 proxy_pass 里，方便以后换成备用线路。
upstream fusion_upstream {
    server api.apilio.ai:443;
    keepalive 32;
}

# HTTP 一律跳 HTTPS（Let's Encrypt 续期验证除外，certbot 会自动插）
server {
    listen 80;
    listen [::]:80;
    server_name api.giwin.cn;

    # 只放行验证路径，其余全部跳转
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # ⚠ nginx 1.24（Ubuntu 24.04 自带）**不支持 `http2 on;`**，那是 1.25.1 才有的语法，
    #   写了会 nginx -t 直接报 unknown directive。必须用 listen ... http2 老写法。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.giwin.cn;

    # 证书由 certbot --nginx 自动写入；若手动上传请改这两行
    ssl_certificate     /etc/letsencrypt/live/api.giwin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.giwin.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- 请求体 -------------------------------------------------------------
    # 4K 参考图 base64 后单张可达 10MB 以上，多图叠加会更长；给足余量。
    client_max_body_size 80m;
    client_body_buffer_size 1m;
    client_body_timeout 300s;

    # --- 限流 ---------------------------------------------------------------
    limit_req  zone=fusion_api burst=30 nodelay;
    limit_conn fusion_conn 16;

    # --- 日志（排查用，含上游耗时）------------------------------------------
    access_log /var/log/nginx/fusion-api.access.log;
    error_log  /var/log/nginx/fusion-api.error.log warn;

    # --- 路径白名单 ---------------------------------------------------------
    # 只放行 OpenAI 兼容接口 + 图片取回路径，其余 404，避免被当免费梯子用。
    #
    # ⚠ 为什么图片路径必须在白名单里：客户端拿到生成结果的 URL 后会自己再 fetch 一次
    #   把图下载下来（providers.js 约 2040 行）。如果开了下面的 sub_filter 却没放行
    #   图片路径，URL 会被改写成 api.giwin.cn/... 然后 404 —— 表现就是「出图失败」。
    #   两者的开关必须同步。
    location ~ ^/(v1/|files/|uploads/|p/) {
        proxy_pass https://fusion_upstream;

        # 上游要求正确的 Host，否则 new_api 网关会 404
        proxy_set_header Host              api.apilio.ai;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 透传鉴权头（用户自己的额度码，不能改）
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Content-Type      $http_content_type;
        proxy_set_header Accept            $http_accept;

        # --- TLS 到上游 ---
        proxy_ssl_server_name on;
        proxy_ssl_name        api.apilio.ai;
        proxy_ssl_protocols   TLSv1.2 TLSv1.3;

        # --- 超时：生图实测 40~180 秒，必须给足 ---
        proxy_connect_timeout 20s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # --- 不缓冲：响应可能很大，且要尽早把字节回给客户端 ---
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # --- 响应体域名替换（默认关闭，见下方说明）---
        #
        # 开它的收益：上游若把图片直链写成 https://api.apilio.ai/...，客户右键
        #   「复制图片地址」就会看到上游域名，反代等于白做。
        # 开它的风险：改写后的 URL 必须落在上面的白名单里，否则客户端下载图片 404，
        #   直接表现为「出图失败」。而图片真实路径长什么样，我们还没实测过。
        #
        # 所以：默认关闭。等服务器起来、用 probe.mjs --image 打出真实 URL 格式，
        # 确认路径能在白名单里命中之后，再把下面三行取消注释。
        #
        # proxy_set_header Accept-Encoding "";
        # sub_filter 'https://api.apilio.ai' 'https://api.giwin.cn';
        # sub_filter_once off;
        # sub_filter_types application/json;
    }

    # 健康检查（部署时用来确认反代活着，不转发上游）
    location = /__health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "fusion-proxy ok\n";
    }

    # 其它一律拒绝
    location / {
        return 404;
    }
}
