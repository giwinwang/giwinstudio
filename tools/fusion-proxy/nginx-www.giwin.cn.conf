# 官网 www.giwin.cn —— 反代到 OSS 香港同地域内网（内网流出免费）
server {
    listen 80;
    listen [::]:80;
    server_name www.giwin.cn;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.giwin.cn;

    ssl_certificate     /etc/letsencrypt/live/www.giwin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.giwin.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    access_log /var/log/nginx/giwin-site.access.log;
    error_log  /var/log/nginx/giwin-site.error.log warn;
    # gw-inline: OSS default-domain forces attachment on html
    proxy_hide_header Content-Disposition;
    add_header Content-Disposition "inline" always;
    # gw-inline: cap download rate to protect API bandwidth
    limit_rate_after 8m;
    limit_rate 10m;

    location = / {
        proxy_pass http://giwin-cn-web.oss-cn-hongkong-internal.aliyuncs.com/index.html;
        proxy_set_header Host giwin-cn-web.oss-cn-hongkong-internal.aliyuncs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;
        proxy_hide_header x-oss-request-id;
        proxy_hide_header x-oss-server-time;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://giwin-cn-web.oss-cn-hongkong-internal.aliyuncs.com;
        proxy_set_header Host giwin-cn-web.oss-cn-hongkong-internal.aliyuncs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;
        proxy_hide_header x-oss-request-id;
        proxy_hide_header x-oss-server-time;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }
}
